apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        resources:
          requests: { cpu: 500m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cache-redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: cache-redis } }
  template:
    metadata: { labels: { app: cache-redis } }
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: batch-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: batch-worker } }
  template:
    metadata: { labels: { app: batch-worker } }
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh","-c","while true; do timeout 20 sh -c 'while :; do :; done'; sleep 100; done"]
        resources:
          requests: { cpu: 250m, memory: 256Mi }
          limits: { cpu: 500m, memory: 512Mi }