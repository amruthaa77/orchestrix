apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateless-web-service
  labels:
    app: stateless-web-service
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stateless-web-service
  template:
    metadata:
      labels:
        app: stateless-web-service
        tier: frontend
    spec:
      containers:
      - name: web-app
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
